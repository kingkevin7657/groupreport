            <summary>Q1: 如果學生當天請病假，可以退餐費嗎？</summary>
            <p style="padding: 10px; background-color: #f9f9f9; margin-top: 5px;">可以。家長只要在當天早上 8:30 前打電話給我們的客服登記，當天的餐費就會在下個月的帳單中直接扣除。</p>
        </details>
        
        <details>
            <summary>Q2: 智膳學堂怎麼確保午餐送到學校時還是熱的？</summary>
            <p style="padding: 10px; background-color: #f9f9f9; margin-top: 5px;">我們擁有專業的保溫物流車隊。所有的餐盒在出廠時都會放進食品級的專業保溫箱，送到學校時溫度一定在 60°C 以上，符合食安標準。</p>
