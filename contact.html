    <div class="container">
        <h2>7. 聯絡我們 / 學校試餐申請表單 (Contact)</h2>
        <p>如果您想了解更多細節或為學校申請試餐，請填寫下面表格聯絡我們（滿足聯絡頁面與表單需求）：</p>
        
        <form action="index.html" method="get">
            <div class="form-group">
                <label>學校名稱：</label>
                <input type="text" name="school" required placeholder="請填寫學校名稱">
            </div>
            <div class="form-group">
                <label>聯絡人：</label>
                <input type="text" name="name" required placeholder="陳老師 / 張先生">
            </div>
            <div class="form-group">
                <label>聯絡電話：</label>
                <input type="tel" name="phone" required placeholder="例如: 23456789">
            </div>
            <div class="form-group">
                <label>備註訊息：</label><br>
                <textarea name="msg" rows="4" style="width: 100%;" placeholder="請輸入您的具體需求..."></textarea>
            </div>
            <input type="submit" value="提交表單" style="padding: 8px 20px; background-color: #10b981; color: white; border: none; cursor: pointer;">
        </form>
    </div>

    <footer></footer>
</body>
